<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swen Hybrid Demo</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1020; color: #e8edf7;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }
    .title { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #9fb0d1; margin-bottom: 24px; }
    .card {
      background: #121a31; border: 1px solid #26314f; border-radius: 18px;
      padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); margin-bottom: 16px;
    }
    textarea {
      width: 100%; min-height: 120px; resize: vertical; border-radius: 14px; border: 1px solid #324161;
      background: #0b1224; color: #e8edf7; padding: 14px; font-size: 16px; box-sizing: border-box;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 600;
      background: #5b8cff; color: white; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 12px;
      background: #0b1224; border: 1px solid #324161; color: #a9b8d6; font-size: 13px;
    }
    .output {
      white-space: pre-wrap; line-height: 1.7; font-size: 18px; min-height: 140px;
    }
    .prefix { color: #7dd3fc; font-weight: 600; }
    .cloud { color: #f8fafc; }
    .muted { color: #8b9abb; }
    .err { color: #fca5a5; }
    .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8b9abb; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Demo</div>
    <div class="sub">Local model starts the answer with the first 8 words. Cloud model continues from that exact prefix.</div>

    <div class="card">
      <div class="label">Input</div>
      <textarea id="input" placeholder="Ask something..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button id="sendBtn">Generate</button>
        <div class="pill" id="status">Idle</div>
      </div>
    </div>

    <div class="card">
      <div class="label">Response</div>
      <div class="output"><span id="prefix" class="prefix"></span><span id="cloud" class="cloud"></span></div>
    </div>

    <div class="card">
      <div class="label">Metrics</div>
      <div class="row">
        <div class="pill">Local first token: <strong id="ftt">-</strong></div>
        <div class="pill">Cloud model: <strong id="cloudModel">-</strong></div>
        <div class="pill">Cloud latency: <strong id="cloudLatency">-</strong></div>
      </div>
      <div id="error" class="err" style="margin-top:12px;"></div>
      <div id="rawLocal" class="muted" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');
    const prefixEl = document.getElementById('prefix');
    const cloudEl = document.getElementById('cloud');
    const fttEl = document.getElementById('ftt');
    const cloudModelEl = document.getElementById('cloudModel');
    const cloudLatencyEl = document.getElementById('cloudLatency');
    const errorEl = document.getElementById('error');
    const rawLocalEl = document.getElementById('rawLocal');

    function setStatus(text) { statusEl.textContent = text; }

    async function generate() {
      const message = inputEl.value.trim();
      if (!message) return;

      sendBtn.disabled = true;
      prefixEl.textContent = '';
      cloudEl.textContent = '';
      errorEl.textContent = '';
      rawLocalEl.textContent = '';
      fttEl.textContent = '-';
      cloudLatencyEl.textContent = '-';
      setStatus('Starting...');

      const resp = await fetch('http://127.0.0.1:8000/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      if (!resp.ok || !resp.body) {
        const text = await resp.text();
        errorEl.textContent = text || 'Request failed';
        sendBtn.disabled = false;
        setStatus('Failed');
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      setStatus('Streaming...');

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const blocks = buffer.split('\n\n');
        buffer = blocks.pop() || '';

        for (const block of blocks) {
          const lines = block.split('\n');
          let event = 'message';
          let data = '';
          for (const line of lines) {
            if (line.startsWith('event: ')) event = line.slice(7);
            if (line.startsWith('data: ')) data += line.slice(6);
          }
          if (!data) continue;
          const payload = JSON.parse(data);

          if (event === 'meta') {
            fttEl.textContent = `${payload.first_token_ms} ms`;
            cloudModelEl.textContent = payload.cloud_model;
            rawLocalEl.textContent = `Local raw draft: ${payload.raw_local_text}`;
          } else if (event === 'local_prefix') {
            prefixEl.textContent = payload.text + ' ';
          } else if (event === 'cloud_delta') {
            cloudEl.textContent += payload.text;
          } else if (event === 'done') {
            cloudLatencyEl.textContent = `${payload.cloud_latency_ms} ms`;
            setStatus('Done');
          } else if (event === 'error') {
            errorEl.textContent = payload.message;
            setStatus('Error');
          }
        }
      }

      sendBtn.disabled = false;
    }

    sendBtn.addEventListener('click', generate);
    inputEl.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
